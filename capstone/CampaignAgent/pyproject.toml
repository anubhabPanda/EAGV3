[project]
name = "eagv3-sourcecode"
version = "0.1.0"
description = "Session 16 general agent: capability-driven, outcome-by-outcome live-graph planning on the S15 runtime"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "cryptography>=42",
    "grpcio>=1.70",
    "a2a-sdk[grpc]>=1.0,<2",
    "faiss-cpu>=1.11,<2",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "ddgs>=9,<10",
    "networkx>=3.6,<4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
sourcecode = "sourcecode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Exactly one package. Nothing is nested inside a prior session's namespace.
packages = ["sourcecode"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "sourcecode/core"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [
    # Generated protobuf gencode is reproduced verbatim, never hand-edited.
    "sourcecode/core/a2a/a2a_s13_pb2.py",
    "sourcecode/core/a2a/a2a_s13_pb2_grpc.py",
]

[tool.ruff.lint]
# Pinned explicitly rather than left to whatever the installed ruff defaults to,
# so CI and a laptop check the same rules a year from now.
select = ["E4", "E7", "E9", "F", "W", "I"]
# A few teaching examples intentionally keep tiny state transitions on one line.
ignore = ["E701", "E702"]

[tool.ruff.lint.per-file-ignores]
"sourcecode/core/a2a/tests/test_hardening.py" = ["F401"]
