  .Text.subtitle{font-style:italic;color:var(--ink-muted);font-size:15px}
  .Text.caption{font-size:12px;color:var(--ink-muted);font-family:var(--font-mono)}
  .Column{display:flex;flex-direction:column;gap:14px}
  .List{display:flex;flex-direction:column;gap:8px}
  .Row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--surface);border:1px solid var(--rule);border-radius:9px}

  .field.check{flex-direction:row;align-items:center;gap:8px}

  .Modal .mtag{font-family:var(--font-mono);font-size:10px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.06em}
  .StatTile{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px}
  .StatTile .lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);font-weight:600;font-family:var(--font-mono)}
  .StatTile .val{font-size:30px;font-weight:700;color:var(--ink);line-height:1.1;margin-top:6px}
  .StatTile .dl{font-size:11px;color:var(--ink-muted);margin-top:4px}
  .StatTile.good{border-top:3px solid var(--green)}.StatTile.warn{border-top:3px solid var(--amber)}.StatTile.neutral{border-top:3px solid var(--accent)}
  .chart{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px}
  .chart .ct{font-size:12px;font-weight:600;color:var(--ink-muted);margin-bottom:8px;font-family:var(--font-mono)}

  th{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);cursor:pointer;user-select:none;background:var(--surface-alt)}
  tr:last-child td{border-bottom:none}
  .filter{margin-bottom:8px;padding:6px 10px;border:1px solid var(--rule-strong);border-radius:8px;font-size:13px;width:100%;max-width:240px;font-family:var(--font-mono)}

  .tabs button{border:1px solid var(--rule-strong);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font-mono);color:var(--ink-muted)}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .Approval button{border-radius:8px;padding:7px 16px;font-weight:600;font-size:13px;cursor:pointer;border:1px solid var(--rule-strong);background:#fff}
  .Approval button.ok{background:var(--green);color:#fff;border-color:var(--green)}
  .prog{height:12px;border-radius:999px;background:var(--surface-alt);border:1px solid var(--rule);overflow:hidden}
  .prog>i{display:block;height:100%;background:var(--green)}
  @media (prefers-color-scheme:dark){:root{--bg:#0d0f14;--surface:#161922;--surface-alt:#11131a;--ink:#f3f5f9;--ink-body:#e4e8f0;--ink-muted:#9aa4b8;--rule:#252a36;--rule-strong:#333a49}body{background:var(--surface-alt)}}

  .Text .md-h{font-weight:700;color:var(--ink);margin:12px 0 4px}.Text .md-p{margin:6px 0;line-height:1.6}.Text .md-ul{margin:6px 0 6px 4px;padding-left:18px}.Text .md-ul li{margin:3px 0}

tructure. You do not author data.**\n\nThe harness builds the data model from what the run actually produced, and hands\nyou the list of pointers that exist as `available_pointers`. Your job is to\nchoose components and bind them to those pointers.\n\n```json\n{\"id\": \"q1_stem\", \"type\": \"Text\", \"variant\": \"body\", \"text\": {\"$bind\": \"/item_0_detail\"}}\n```\n\n**Bind only to a pointer that appears in `available_pointers`.** A pointer you\ninvent resolves to nothing. The surface will still validate, because the\nstructure is legal, and it will render with every field blank. That failure is\nsilent: no rejection, no error, an interface full of empty cards.\n\nRead `available_pointers` first and design the layout around what is genuinely\nthere. If the data you want is not in the list, the fix is upstream: the node\nthat produced the content needs to emit it as structured data, not prose. Do not\npaper over it by inventing a path.\n\nValues you may write literally are the ones no user supplied: a `Card` title, a\n`Tabs` label, a section heading. Everything that came from the run is a binding.\n\n## Four things about the render client you cannot guess\n\n**`Modal` does not hide anything.** The client draws it as a labelled block and\nalways renders its children. If you put answers in a `Modal`, they are on screen\nimmediately. Never use `Modal` to conceal.\n\n**`Tabs` genuinely conceals.** It renders only the active panel; the others are\nnot in the DOM until clicked. `Tabs` is the only concealment you have. Each child\nof a `Tabs` is one whole panel, and `labels` is a comma-separated string naming\nthem in order.\n\n**Buttons do four things and each is a server round-trip.** `onPress` accepts only\n`approve`, `reject`, `request_data`, `rerun`. There is no `submit` and no `reveal`.\nIf your design needs a button that does something else, the design is wrong: use\n`Tabs` for progressive reveal and inputs for local state.\n\n**`Text` with `variant: \"heading rces": []}}, "goal": "Make a set of 10 IIT JEE practice questions for me, with four options each and a worked solution for every one. Cover mechanics, calculus and organic chemistry. Show it to me as something I can actually work through.", "item_0_detail": "{\"description\": \"This skill should be used whenever the run has to produce a user interface rather than prose. Load it before adding a compose_surface node, and whenever the request asks to \\\"show\\\", \\\"display\\\", \\\"render\\\", \\\"make an app\\\", \\\"build a page\\\", \\\"make it interactive\\\", or asks for a quiz, exercise sheet, dashboard, form, report or worksheet. It carries the closed component catalog, the data-binding rule, and four behaviours of the render client that are not guessable.\", \"instructions\": \"You are composing an A2UI surface. Read this before you plan the nodes, not after.\\n\\n## The shape you produce\\n\\nA surface is three things and no markup:\\n\\n```json\\n{\\n  \\\"root\\\": \\\"col_main\\\",\\n  \\\"components\\\": [ {\\\"id\\\": \\\"...\\\", \\\"type\\\": \\\"...\\\", ...}, ... ],\\n  \\\"dataModel\\\": { \\\"title\\\": \\\"...\\\", \\\"questions\\\": [...] }\\n}\\n```\\n\\n`components` is a flat array linked by `id`, not a nested tree. A parent names its\\nchildren by id in a `children` list. One component is the `root`.\\n\\n## The rule that matters more than any other\\n\\n**You compose structure. You do not author data.**\\n\\nThe harness builds the data model from what the run actually produced, and hands\\nyou the list of pointers that exist as `available_pointers`. Your job is to\\nchoose components and bind them to those pointers.\\n\\n```json\\n{\\\"id\\\": \\\"q1_stem\\\", \\\"type\\\": \\\"Text\\\", \\\"variant\\\": \\\"body\\\", \\\"text\\\": {\\\"$bind\\\": \\\"/item_0_detail\\\"}}\\n```\\n\\n**Bind only to a pointer that appears in `available_pointers`.** A pointer you\\ninvent resolves to nothing. The surface will still validate, because the\\nstructure is legal, and it will render with every field blank. That failure is\\nsilent: no rejection, no error, an interface full of empty cards.\\n\\nRead `available_pointers` first and design the layout around what is genuinely\\nthere. If the data you want is not in the list, the fix is upstream: the node\\nthat produced the content needs to emit it as structured data, not prose. Do not\\npaper over it b", "item_0_label": "load_a2ui_skill", "item_count": 1, "items": [{"label": "load_a2ui_skill"}], "load_a2ui_skill_description": "This skill should be used whenever the run has to produce a user interface rather than prose. Load it before adding a compose_surface node, and whenever the request asks to \"show\", \"display\", \"render\", \"make an app\", \"build a page\", \"make it interactive\", or asks for a quiz, exercise sheet, dashboard, form, report or worksheet. It carries the closed component catalog, the data-binding rule, and four behaviours of the render client that are not guessable.", "load_a2ui_skill_instructions": "You are composing an A2UI surface. Read this before you plan the nodes, not after.\n\n## The shape you produce\n\nA surface is three things and no markup:\n\n```json\n{\n  \"root\": \"col_main\",\n  \"components\": [ {\"id\": \"...\", \"type\": \"...\", ...}, ... ],\n  \"dataModel\": { \"title\": \"...\", \"questions\": [...] }\n}\n```\n\n`components` is a flat array linked by `id`, not a nested tree. A parent names its\nchildren by id in a `children` list. One component is the `root`.\n\n## The rule that matters more than any other\n\n**You compose structure. You do not author data.**\n\nThe harness builds the data model from what the run actually produced, and hands\nyou the list of pointers that exist as `available_pointers`. Your job is to\nchoose components and bind them to those pointers.\n\n```json\n{\"id\": \"q1_stem\", \"type\": \"Text\", \"variant\": \"body\", \"text\": {\"$bind\": \"/item_0_detail\"}}\n```\n\n**Bind only to a pointer that appears in `available_pointers`.** A pointer you\ninvent resolves to nothing. The surface will still validate, because the\nstructure is legal, and it will render with every field blank. That failure is\nsilent: no rejection, no error, an interface full of empty cards.\n\nRead `available_pointers` first and design the layout around what is genuinely\nthere. If the data you want is not in the list, the fix is upstream: the node\nthat produced the content needs to emit it as structured data, not prose. Do not\npaper over it by inventing a path.\n\nValues you may write literally are the ones no user supplied: a `Card` title, a\n`Tabs` label, a section heading. Everything that came from the run is a binding.\n\n## Four things about the render client you cannot guess\n\n**`Modal` does not hide anything.** The client draws it as a labelled block and\nalways renders its children. If you put answers in a `Modal`, they are on screen\nimmediately. Never use `Modal` to conceal.\n\n**`Tabs` genuinely conceals.** It renders only the active panel; the others are\nnot in the DOM until clicked. `Tabs` is the only concealment you have. Each child\nof a `Tabs` is one whole panel, and `labels` is a comma-separated string naming\nthem in order.\n\n**Buttons do four things and each is a server round-trip.** `onPress` accepts only\n`approve`, `reject`, `request_data`, `rerun`. There is no `submit` and no `reveal`.\nIf your design needs a button that does something else, the design is wrong: use\n`Tabs` for progressive reveal and inputs for local state.\n\n**`Text` with `variant: \"heading\"` is rendered literally; `body` is rendered as\nsafe markdown.** Put `$x^2$`-style plain text in body variants and it survives.\n\nInputs (`TextField`, `CheckBox`, `InputChoice`, `Slider`) write straight back into\nthe data model in the browser, so a learner can select answers with no round-trip.\n\n## Composing an exercise or quiz\n\nThis is the pattern that works with the constraints above:\n\n- `Tabs` at the top with `labels: \"Questions, Solutions\"`.\n- Panel one: a `Column` of `Card`s, one per item. Each card holds a `Text` (body)\n  bound to the pointer carrying that item's question, and an `InputChoice` bound\n  to the pointer carrying its options.\n- Panel two: a `Column` of `Card`s bound to the pointers carrying the solutions.\n\nThe learner answers in tab one and checks in tab two. No buttons, no actions, no\nround-trip, and nothing is spoiled because tab two is not rendered until clicked.\n\nEvery one of those bindings must come from `available_pointers`. If the run\nproduced ten questions but the only pointers are `/item_0_label` and\n`/item_0_detail`, then that is what you bind, and the layout follows the data you\nhave rather than the data you wish you had.\n\nUse `Notice` with `tone: \"warn\"` to carry an instruction like \"attempt before\nopening Solutions\".\n\n## Before you finish\n\nCall `load_skill` with `reference: \"catalog.md\"` to get every component type and\nits exact properties. Do that before composing rather than guessing a property\nname: a type or property that is not in the catalog is rejected by the validator,\nand the rejection names the component and the field.\n\nKeep the data model flat and boring. Arrays of objects with short keys bind\ncleanly; deep nesting produces pointers nobody can read.", "load_a2ui_skill_note": "Its guidance is now in your system prompt for the rest of this run. It names these reference files: ['catalog.md']. Call load_skill again with 'reference' set to read one.", "load_a2ui_skill_references": ["catalog.md"], "load_a2ui_skill_skill": "a2ui", "metrics": [{"label": "load_a2ui_skill", "value": 0}], "progress_max": 3, "progress_value": 2, "results": [{"detail": "{\"description\": \"This skill should be used whenever the run has to produce a user interface rather than prose. Load it before adding a compose_surface node, and whenever the request asks to \\\"show\\\", \\\"display\\\", \\\"render\\\", \\\"make an app\\\", \\\"build a page\\\", \\\"make it interactive\\\", or asks for a quiz, exercise sheet, dashboard, form, report or worksheet. It carries the closed component catalog, the data-binding rule, and four behaviours of the render client that are not guessable.\", \"instructions\": \"You are composing an A2UI surface. Read this before you plan the nodes, not after.\\n\\n## The shape you produce\\n\\nA surface is three things and no markup:\\n\\n```json\\n{\\n  \\\"root\\\": \\\"col_main\\\",\\n  \\\"components\\\": [ {\\\"id\\\": \\\"...\\\", \\\"type\\\": \\\"...\\\", ...}, ... ],\\n  \\\"dataModel\\\": { \\\"title\\\": \\\"...\\\", \\\"questions\\\": [...] }\\n}\\n```\\n\\n`components` is a flat array linked by `id`, not a nested tree. A parent names its\\nchildren by id in a `children` list. One component is the `root`.\\n\\n## The rule that matters more than any other\\n\\n**You compose structure. You do not author data.**\\n\\nThe harness builds the data model from what the run actually produced, and hands\\nyou the list of pointers that exist as `available_pointers`. Your job is to\\nchoose components and bind them to those pointers.\\n\\n```json\\n{\\\"id\\\": \\\"q1_stem\\\", \\\"type\\\": \\\"Text\\\", \\\"variant\\\": \\\"body\\\", \\\"text\\\": {\\\"$bind\\\": \\\"/item_0_detail\\\"}}\\n```\\n\\n**Bind only to a pointer that appears in `available_pointers`.** A pointer you\\ninvent resolves to nothing. The surface will still validate, because the\\nstructure is legal, and it will render with every field blank. That failure is\\nsilent: no rejection, no error, an interface full of empty cards.\\n\\nRead `available_pointers` first and design the layout around what is genuinely\\nthere. If the data you want is not in the list, the fix is upstream: the node\\nthat produced the content needs to emit it as structured data, not prose. Do not\\npaper over it b", "label": "load_a2ui_skill"}], "section_0_detail": "For rolling without slipping, we have two main equations:\n1.  Translational motion along the incline: Mg sin\u03b8 - f = Ma (where f is the static friction force and a is the acceleration of the center of mass).\n2.  Rotational motion about the center of mass: fR = I\u03b1 (where I is the moment of inertia and \u03b1 is the angular acceleration).\n\nFor a solid cylinder, the moment of inertia I = (1/2)MR\u00b2.\nFor rolling without slipping, the linear acceleration a is related to the angular acceleration \u03b1 by a = R\u03b1, so \u03b1 = a/R.\n\nSubstitute I and \u03b1 into the rotational equation:\nfR = (1/2)MR\u00b2 (a/R)\nfR = (1/2)MRa\nf = (1/2)Ma\n\nNow substitute this expression for f into the translational equation:\nMg sin\u03b8 - (1/2)Ma = Ma\nMg sin\u03b8 = Ma + (1/2)Ma\nMg sin\u03b8 = (3/2)Ma\n\nDivide both sides by M:\ng sin\u03b8 = (3/2)a\na = (2/3)g sin\u03b8\n\nid: M001\n\nanswer: A", "section_0_heading": "A solid cylinder of mass M and radius R rolls without slipping down an inclined plane of angle \u03b8. What is the acceleration of its center of mass?", "section_0_options": ["A) (2/3)g sin\u03b8", "B) (1/2)g sin\u03b8", "C) (2/5)g sin\u03b8", "D) (3/4)g sin\u03b8"], "section_0_points": "\u2022 A) (2/3)g sin\u03b8\n\u2022 B) (1/2)g sin\u03b8\n\u2022 C) (2/5)g sin\u03b8\n\u2022 D) (3/4)g sin\u03b8", "section_1_detail": "Let I = \u222b[from 0 to \u03c0/2] (sin x) / (sin x + cos x) dx  --- (1)\n\nWe use the property of definite integrals: \u222b[from 0 to a] f(x) dx = \u222b[from 0 to a] f(a-x) dx.\nApplying this property with a = \u03c0/2:\nI = \u222b[from 0 to \u03c0/2] (sin (\u03c0/2 - x)) / (sin (\u03c0/2 - x) + cos (\u03c0/2 - x)) dx\nSince sin(\u03c0/2 - x) = cos x and cos(\u03c0/2 - x) = sin x, the integral becomes:\nI = \u222b[from 0 to \u03c0/2] (cos x) / (cos x + sin x) dx  --- (2)\n\nNow, add equation (1) and equation (2):\n2I = \u222b[from 0 to \u03c0/2] [(sin x) / (sin x + cos x) + (cos x) / (cos x + sin x)] dx\n2I = \u222b[from 0 to \u03c0/2] [(sin x + cos x) / (sin x + cos x)] dx\n2I = \u222b[from 0 to \u03c0/2] 1 dx\n\nIntegrate 1 with respect to x:\n2I = [x] from 0 to \u03c0/2\n2I = (\u03c0/2) - 0\n2I = \u03c0/2\n\nDivide by 2 to find I:\nI = \u03c0/4\n\nid: C001\n\nanswer: A", "section_1_heading": "Evaluate the definite integral: \u222b[from 0 to \u03c0/2] (sin x) / (sin x + cos x) dx", "section_1_options": ["A) \u03c0/4", "B) \u03c0/2", "C) \u03c0/8", "D) \u03c0"], "section_1_points": "\u2022 A) \u03c0/4\n\u2022 B) \u03c0/2\n\u2022 C) \u03c0/8\n\u2022 D) \u03c0", "section_2_detail": "SN1 (Substitution Nucleophilic Unimolecular) reactions proceed through a carbocation intermediate. The rate-determining step is the formation of this carbocation. Therefore, the stability of the carbocation intermediate directly influences the rate of the SN1 reaction.\n\nThe general order of carbocation stability is: Tertiary (3\u00b0) > Secondary (2\u00b0) > Primary (1\u00b0) > Methyl.\n\nLet's analyze the carbocation formed from each option:\nA) CH\u2083CH\u2082Br (Ethyl bromide) forms a primary carbocation (CH\u2083CH\u2082\u207a).\nB) (CH\u2083)\u2082CHBr (Isopropyl bromide) forms a secondary carbocation ((CH\u2083)\u2082CH\u207a).\nC) (CH\u2083)\u2083CBr (tert-Butyl bromide) forms a tertiary carbocation ((CH\u2083)\u2083C\u207a).\nD) CH\u2083Br (Methyl bromide) forms a methyl carbocation (CH\u2083\u207a).\n\nSince the tertiary carbocation ((CH\u2083)\u2083C\u207a) is the most stable among these, (CH\u2083)\u2083CBr will form this carbocation most readily, leading to the fastest SN1 reaction rate.\n\nid: O001\n\nanswer: C", "section_2_heading": "Which of the following compounds will undergo SN1 reaction fastest?", "section_2_options": ["A) CH\u2083CH\u2082Br", "B) (CH\u2083)\u2082CHBr", "C) (CH\u2083)\u2083CBr", "D) CH\u2083Br"], "section_2_points": "\u2022 A) CH\u2083CH\u2082Br\n\u2022 B) (CH\u2083)\u2082CHBr\n\u2022 C) (CH\u2083)\u2083CBr\n\u2022 D) CH\u2083Br", "section_3_detail": "Since the inclined plane is frictionless, there are no non-conservative forces doing work (like friction). Therefore, mechanical energy is conserved.\n\nInitial state (at the top):\nMass (m) = 2 kg\nHeight (h_initial) = 5 m\nInitial speed (v_initial) = 0 m/s (released from rest)\n\nInitial Potential Energy (PE_initial) = mgh_initial = 2 kg * 10 m/s\u00b2 * 5 m = 100 J\nInitial Kinetic Energy (KE_initial) = (1/2)mv_initial\u00b2 = (1/2) * 2 kg * (0 m/s)\u00b2 = 0 J\nTotal Initial Mechanical Energy (E_initial) = PE_initial + KE_initial = 100 J + 0 J = 100 J\n\nFinal state (at the bottom):\nHeight (h_final) = 0 m (relative to the bottom)\nFinal speed (v_final) = ?\n\nFinal Potential Energy (PE_final) = mgh_final = 2 kg * 10 m/s\u00b2 * 0 m = 0 J\nFinal Kinetic Energy (KE_final) = (1/2)mv_final\u00b2 = (1/2) * 2 kg * v_final\u00b2 = v_final\u00b2 J\nTotal Final Mechanical Energy (E_final) = PE_final + KE_final = 0 J + v_final\u00b2 J = v_final\u00b2 J\n\nBy the principle of conservation of mechanical energy:\nE_initial = E_final\n100 J = v_final\u00b2 J\nv_final\u00b2 = 100\nv_final = \u221a100\nv_final = 10 m/s\n\nid: M002\n\nanswer: B", "section_3_heading": "A block of mass 2 kg is released from rest at the top of a frictionless inclined plane of height 5 m. What is the speed of the block when it reaches the bottom of the incline? (Take g = 10 m/s\u00b2)", "section_3_options": ["A) 5 m/s", "B) 10 m/s", "C) 15 m/s", "D) 20 m/s"], "section_3_points": "\u2022 A) 5 m/s\n\u2022 B) 10 m/s\n\u2022 C) 15 m/s\n\u2022 D) 20 m/s", "section_4_detail": "Given differential equation: dy/dx = (x+y)\u00b2\n\nThis is a non-linear differential equation. We can solve it by substitution.\nLet v = x+y.\n\nDifferentiate v with respect to x:\ndv/dx = d/dx (x+y)\ndv/dx = 1 + dy/dx\n\nFrom this, we can express dy/dx as: dy/dx = dv/dx - 1.\n\nSubstitute v and dy/dx into the original differential equation:\ndv/dx - 1 = v\u00b2\ndv/dx = 1 + v\u00b2\n\nNow, this is a separable differential equation. Separate the variables v and x:\ndv / (1 + v\u00b2) = dx\n\nIntegrate both sides:\n\u222b [1 / (1 + v\u00b2)] dv = \u222b dx\n\nThe integral of 1/(1+v\u00b2) with respect to v is tan\u207b\u00b9(v).\nThe integral of 1 with respect to x is x.\n\nSo, tan\u207b\u00b9(v) = x + C (where C is the constant of integration).\n\nFinally, substitute back v = x+y:\ntan\u207b\u00b9(x+y) = x + C\n\nid: C002\n\nanswer: A", "section_4_heading": "The solution of the differential equation dy/dx = (x+y)\u00b2 is:", "section_4_options": ["A) tan\u207b\u00b9(x+y) = x + C", "B) tan\u207b\u00b9(x+y) = y + C", "C) sin\u207b\u00b9(x+y) = x + C", "D) sin\u207b\u00b9(x+y) = y + C"], "section_4_points": "\u2022 A) tan\u207b\u00b9(x+y) = x + C\n\u2022 B) tan\u207b\u00b9(x+y) = y + C\n\u2022 C) sin\u207b\u00b9(x+y) = x + C\n\u2022 D) sin\u207b\u00b9(x+y) = y + C", "section_5_detail": "First, let's draw the structural formula of 2,3-dibromobutane:\nCH\u2083 - CH(Br) - CH(Br) - CH\u2083\n\nA chiral center (or stereocenter) is typically a carbon atom that is bonded to four different groups.\n\nLet's examine each carbon atom:\n\n1.  **C1 (CH\u2083)**: This carbon is bonded to three hydrogen atoms and one CH(Br)CH(Br)CH\u2083 group. Since it has three identical hydrogen atoms, it is not a chiral center.\n\n2.  **C2 (CH(Br))**: This carbon is bonded to four different groups:\n    *   A methyl group (CH\u2083)\n    *   A hydrogen atom (H)\n    *   A bromine atom (Br)\n    *   A -CH(Br)CH\u2083 group\n    Since all four groups are different, C2 is a chiral center.\n\n3.  **C3 (CH(Br))**: This carbon is bonded to four different groups:\n    *   A methyl group (CH\u2083)\n    *   A hydrogen atom (H)\n    *   A bromine atom (Br)\n    *   A -CH(Br)CH\u2083 group\n    Since all four groups are different, C3 is a chiral center.\n\n4.  **C4 (CH\u2083)**: Similar to C1, this carbon is bonded to three hydrogen atoms, so it is not a chiral center.\n\nTherefore, 2,3-dibromobutane has 2 chiral centers (C2 and C3).\n\nid: O002\n\nanswer: C", "section_5_heading": "How many chiral centers are present in 2,3-dibromobutane?", "section_5_options": ["A) 0", "B) 1", "C) 2", "D) 3"], "section_5_points": "\u2022 A) 0\n\u2022 B) 1\n\u2022 C) 2\n\u2022 D) 3", "section_6_detail": "The displacement of a particle executing Simple Harmonic Motion (SHM) starting from the mean position (x=0) is given by the equation:\nx(t) = A sin(\u03c9t)\n\nWhere:\n*   A is the amplitude\n*   \u03c9 is the angular frequency\n*   t is the time\n\nThe angular frequency \u03c9 is related to the time period T by \u03c9 = 2\u03c0/T.\nSo, the equation becomes:\nx(t) = A sin((2\u03c0/T)t)\n\nWe want to find the time 't' when the particle travels from x = 0 to x = A/2.\nSet x(t) = A/2:\nA/2 = A sin((2\u03c0/T)t)\n\nDivide both sides by A:\n1/2 = sin((2\u03c0/T)t)\n\nWe know that sin(\u03c0/6) = 1/2. Therefore:\n(2\u03c0/T)t = \u03c0/6\n\nNow, solve for t:\n2t/T = 1/6\nt = (1/6) * (T/2)\nt = T/12\n\nThe time taken for the particle to travel from x = 0 to x = A/2 is T/12.\n\nid: M003\n\nanswer: D", "section_6_heading": "A particle executes SHM with an amplitude A and time period T. The time taken for the particle to travel from x = 0 to x = A/2 is:", "section_6_options": ["A) T/2", "B) T/4", "C) T/6", "D) T/12"], "section_6_points": "\u2022 A) T/2\n\u2022 B) T/4\n\u2022 C) T/6\n\u2022 D) T/12", "section_7_detail": "To find the local maximum (or minimum) values of a function, we first need to find its critical points by taking the first derivative and setting it to zero.\n\nGiven function: f(x) = x\u00b3 - 6x\u00b2 + 9x + 15\n\nStep 1: Find the first derivative, f'(x).\nf'(x) = d/dx (x\u00b3 - 6x\u00b2 + 9x + 15)\nf'(x) = 3x\u00b2 - 12x + 9\n\nStep 2: Set f'(x) = 0 to find the critical points.\n3x\u00b2 - 12x + 9 = 0\nDivide by 3:\nx\u00b2 - 4x + 3 = 0\n\nFactor the quadratic equation:\n(x - 1)(x - 3) = 0\nSo, the critical points are x = 1 and x = 3.\n\nStep 3: Use the second derivative test to determine if these critical points correspond to a local maximum or minimum.\nFind the second derivative, f''(x).\nf''(x) = d/dx (3x\u00b2 - 12x + 9)\nf''(x) = 6x - 12\n\nEvaluate f''(x) at each critical point:\n*   At x = 1:\n    f''(1) = 6(1) - 12 = 6 - 12 = -6\n    Since f''(1) < 0, there is a local maximum at x = 1.\n\n*   At x = 3:\n    f''(3) = 6(3) - 12 = 18 - 12 = 6\n    Since f''(3) > 0, there is a local minimum at x = 3.\n\nStep 4: Calculate the value of the function at the local maximum.\nSubstitute x = 1 into the original function f(x):\nf(1) = (1)\u00b3 - 6(1)\u00b2 + 9(1) + 15\nf(1) = 1 - 6 + 9 + 15\nf(1) = 19\n\nThus, the local maximum value of the function is 19.\n\nid: C003\n\nanswer: B", "section_7_heading": "Find the local maximum value of f(x) = x\u00b3 - 6x\u00b2 + 9x + 15.", "section_7_options": ["A) 15", "B) 19", "C) 20", "D) 21"], "section_7_points": "\u2022 A) 15\n\u2022 B) 19\n\u2022 C) 20\n\u2022 D) 21", "section_8_detail": "For a compound to be aromatic, it must satisfy H\u00fcckel's rules:\n1.  It must be cyclic.\n2.  It must be planar.\n3.  It must be fully conjugated (have a continuous ring of p-orbitals).\n4.  It must have (4n + 2) \u03c0 electrons, where n is a non-negative integer (0, 1, 2, ...).\n\nLet's analyze each option:\n\nA) **Cyclobutadiene**: It is cyclic and fully conjugated. It has 2 double bonds, contributing 4 \u03c0 electrons. According to H\u00fcckel's rule, 4 \u03c0 electrons (4n, where n=1) makes it anti-aromatic. It is highly unstable.\n\nB) **Cyclopentadienyl cation**: It is cyclic and fully conjugated (5 carbons, 2 double bonds, and a positive charge on one carbon, meaning an empty p-orbital). It has 2 double bonds, contributing 4 \u03c0 electrons. 4 \u03c0 electrons (4n, where n=1) makes it anti-aromatic. It is highly unstable.\n\nC) **Cycloheptatrienyl cation (Tropylium cation)**: It is a 7-membered cyclic system with 3 double bonds and a positive charge. It is cyclic, planar, and fully conjugated (all 7 carbons are sp\u00b2 hybridized, forming a continuous ring of p-orbitals). It has 3 double bonds, contributing 6 \u03c0 electrons. 6 \u03c0 electrons fits the (4n + 2) rule for n=1 (4*1 + 2 = 6). Therefore, cycloheptatrienyl cation is aromatic.\n\nD) **Cyclooctatetraene**: It is an 8-membered cyclic system with 4 double bonds. It has 8 \u03c0 electrons. 8 \u03c0 electrons (4n, where n=2) would suggest it is anti-aromatic. However, to avoid anti-aromaticity, cyclooctatetraene adopts a non-planar 'tub' shape, which breaks the conjugation. Thus, it is non-aromatic.\n\nBased on H\u00fcckel's rules, only Cycloheptatrienyl cation is aromatic.\n\nid: O003\n\nanswer: C", "section_8_heading": "Which of the following compounds is aromatic?", "section_8_options": ["A) Cyclobutadiene", "B) Cyclopentadienyl cation", "C) Cycloheptatrienyl cation", "D) Cyclooctatetraene"], "section_8_points": "\u2022 A) Cyclobutadiene\n\u2022 B) Cyclopentadienyl cation\n\u2022 C) Cycloheptatrienyl cation\n\u2022 D) Cyclooctatetraene", "section_9_detail": "Let's use the principles of conservation of energy and conservation of linear momentum.\n\nInitial state (at infinite separation):\n*   Initial speeds: v\u2081_initial = 0, v\u2082_initial = 0\n*   Initial separation: r_initial = \u221e\n*   Initial Kinetic Energy (KE_initial) = 0\n*   Initial Potential Energy (PE_initial) = -G m\u2081m\u2082 / r_initial = -G m\u2081m\u2082 / \u221e = 0\n*   Total Initial Energy (E_initial) = 0\n\nFinal state (at separation 'r'):\n*   Final speeds: v\u2081 and v\u2082 (moving towards each other)\n*   Final separation: r\n*   Final Kinetic Energy (KE_final) = (1/2)m\u2081v\u2081\u00b2 + (1/2)m\u2082v\u2082\u00b2\n*   Final Potential Energy (PE_final) = -G m\u2081m\u2082 / r\n*   Total Final Energy (E_final) = (1/2)m\u2081v\u2081\u00b2 + (1/2)m\u2082v\u2082\u00b2 - G m\u2081m\u2082 / r\n\n1.  **Conservation of Energy (E_initial = E_final):**\n    0 = (1/2)m\u2081v\u2081\u00b2 + (1/2)m\u2082v\u2082\u00b2 - G m\u2081m\u2082 / r\n    (1/2)m\u2081v\u2081\u00b2 + (1/2)m\u2082v\u2082\u00b2 = G m\u2081m\u2082 / r  --- (Equation 1)\n\n2.  **Conservation of Linear Momentum:**\n    Since there are no external forces acting on the system, the total linear momentum is conserved.\n    Initial momentum = 0 (both particles are at rest).\n    Final momentum = m\u2081v\u2081 - m\u2082v\u2082 (assuming v\u2081 and v\u2082 are magnitudes, and they move in opposite directions relative to each other).\n    0 = m\u2081v\u2081 - m\u2082v\u2082\n    m\u2081v\u2081 = m\u2082v\u2082  --- (Equation 2)\n\nFrom Equation 2, we can express v\u2081 in terms of v\u2082 (or vice versa):\nv\u2081 = (m\u2082/m\u2081)v\u2082\n\nSubstitute this into Equation 1:\n(1/2)m\u2081((m\u2082/m\u2081)v\u2082)\u00b2 + (1/2)m\u2082v\u2082\u00b2 = G m\u2081m\u2082 / r\n(1/2)m\u2081(m\u2082\u00b2/m\u2081\u00b2)v\u2082\u00b2 + (1/2)m\u2082v\u2082\u00b2 = G m\u2081m\u2082 / r\n(1/2)(m\u2082\u00b2/m\u2081)v\u2082\u00b2 + (1/2)m\u2082v\u2082\u00b2 = G m\u2081m\u2082 / r\n(1/2)v\u2082\u00b2 [ (m\u2082\u00b2/m\u2081) + m\u2082 ] = G m\u2081m\u2082 / r\n(1/2)v\u2082\u00b2 [ (m\u2082\u00b2 + m\u2081m\u2082) / m\u2081 ] = G m\u2081m\u2082 / r\n(1/2)v\u2082\u00b2 [ m\u2082(m\u2082 + m\u2081) / m\u2081 ] = G m\u2081m\u2082 / r\n\nSolve for v\u2082\u00b2:\nv\u2082\u00b2 = [2G m\u2081m\u2082 / r] * [m\u2081 / (m\u2082(m\u2081 + m\u2082))]\nv\u2082\u00b2 = 2G m\u2081\u00b2 / (r(m\u2081 + m\u2082))\nv\u2082 = m\u2081 \u221a[2G / (r(m\u2081 + m\u2082))]\n\nNow, find v\u2081 using v\u2081 = (m\u2082/m\u2081)v\u2082:\nv\u2081 = (m\u2082/m\u2081) * m\u2081 \u221a[2G / (r(m\u2081 + m\u2082))]\nv\u2081 = m\u2082 \u221a[2G / (r(m\u2081 + m\u2082))]\n\nThe relative speed (v_rel) is the sum of their speeds because they are moving towards each other:\nv_rel = v\u2081 + v\u2082\nv_rel = m\u2082 \u221a[2G / (r(m\u2081 + m\u2082))] + m\u2081 \u221a[2G / (r(m\u2081 + m\u2082))]\nv_rel = (m\u2081 + m\u2082) \u221a[2G / (r(m\u2081 + m\u2082))]\n\nTo simplify, bring (m\u2081 + m\u2082) inside the square root:\nv_rel = \u221a[ (m\u2081 + m\u2082)\u00b2 * 2G / (r(m\u2081 + m\u2082)) ]\nv_rel = \u221a[ 2G(m\u2081 + m\u2082) / r ]\n\nid: M004\n\nanswer: A", "section_9_heading": "Two particles of masses m\u2081 and m\u2082 are initially at rest at an infinite distance apart. They start moving towards each other due to mutual gravitational attraction. What is their relative speed when their separation is 'r'?", "section_9_options": ["A) \u221a[2G(m\u2081 + m\u2082)/r]", "B) \u221a[G(m\u2081 + m\u2082)/r]", "C) \u221a[2G(m\u2081m\u2082)/(m\u2081 + m\u2082)r]", "D) \u221a[G(m\u2081m\u2082)/(m\u2081 + m\u2082)r]"], "section_9_points": "\u2022 A) \u221a[2G(m\u2081 + m\u2082)/r]\n\u2022 B) \u221a[G(m\u2081 + m\u2082)/r]\n\u2022 C) \u221a[2G(m\u2081m\u2082)/(m\u2081 + m\u2082)r]\n\u2022 D) \u221a[G(m\u2081m\u2082)/(m\u2081 + m\u2082)r]", "section_events": [{"label": "A) (2/3)g sin\u03b8; B) (1/2)g sin\u03b8; C) (2/5)g sin\u03b8; D) (3/4)g sin\u03b8", "time": "A solid cylinder of mass M and radius R rolls without slipping down an inclined plane of angle \u03b8. What is the acceleration of its center of mass?"}, {"label": "A) \u03c0/4; B) \u03c0/2; C) \u03c0/8; D) \u03c0", "time": "Evaluate the definite integral: \u222b[from 0 to \u03c0/2] (sin x) / (sin x + cos x) dx"}, {"label": "A) CH\u2083CH\u2082Br; B) (CH\u2083)\u2082CHBr; C) (CH\u2083)\u2083CBr; D) CH\u2083Br", "time": "Which of the following compounds will undergo SN1 reaction fastest?"}, {"label": "A) 5 m/s; B) 10 m/s; C) 15 m/s; D) 20 m/s", "time": "A block of mass 2 kg is released from rest at the top of a frictionless inclined plane of height 5 m. What is the speed of the block when it reaches the bottom of the incline? (Take g = 10 m/s\u00b2)"}, {"label": "A) tan\u207b\u00b9(x+y) = x + C; B) tan\u207b\u00b9(x+y) = y + C; C) sin\u207b\u00b9(x+y) = x + C; D) sin\u207b\u00b9(x+y) = y + C", "time": "The solution of the differential equation dy/dx = (x+y)\u00b2 is:"}, {"label": "A) 0; B) 1; C) 2; D) 3", "time": "How many chiral centers are present in 2,3-dibromobutane?"}, {"label": "A) T/2; B) T/4; C) T/6; D) T/12", "time": "A particle executes SHM with an amplitude A and time period T. The time taken for the particle to travel from x = 0 to x = A/2 is:"}, {"label": "A) 15; B) 19; C) 20; D) 21", "time": "Find the local maximum value of f(x) = x\u00b3 - 6x\u00b2 + 9x + 15."}, {"label": "A) Cyclobutadiene; B) Cyclopentadienyl cation; C) Cycloheptatrienyl cation; D) Cyclooctatetraene", "time": "Which of the following compounds is aromatic?"}, {"label": "A) \u221a[2G(m\u2081 + m\u2082)/r]; B) \u221a[G(m\u2081 + m\u2082)/r]; C) \u221a[2G(m\u2081m\u2082)/(m\u2081 + m\u2082)r]; D) \u221a[G(m\u2081m\u2082)/(m\u2081 + m\u2082)r]", "time": "Two particles of masses m\u2081 and m\u2082 are initially at rest at an infinite distance apart. They start moving towards each other due to mutual gravitational attraction. What is their relative speed when their separation is 'r'?"}], "sections": [{"detail": "For rolling without slipping, we have two main equations:\n1.  Translational motion along the incline: Mg sin\u03b8 - f = Ma (where f is the static friction force and a is the acceleration of the center of mass).\n2.  Rotational motion about the center of mass: fR = I\u03b1 (where I is the moment of inertia and \u03b1 is the angular acceleration).\n\nFor a solid cylinder, the moment of inertia I = (1/2)MR\u00b2.\nFor rolling without slipping, the linear acceleration a is related to the angular acceleration \u03b1 by a = R\u03b1, so \u03b1 = a/R.\n\nSubstitute I and \u03b1 into the rotational equation:\nfR = (1/2)MR\u00b2 (a/R)\nfR = (1/2)MRa\nf = (1/2)Ma\n\nNow substitute this expression for f into the translational equation:\nMg sin\u03b8 - (1/2)Ma = Ma\nMg sin\u03b8 = Ma + (1/2)Ma\nMg sin\u03b8 = (3/2)Ma\n\nDivide both sides by M:\ng sin\u03b8 = (3/2)a\na = (2/3)g sin\u03b8\n\nid: M001\n\nanswer: A", "heading": "A solid cylinder of mass M and radius R rolls without slipping down an inclined plane of angle \u03b8. What is the acceleration of its center of mass?", "options": ["A) (2/3)g sin\u03b8", "B) (1/2)g sin\u03b8", "C) (2/5)g sin\u03b8", "D) (3/4)g sin\u03b8"], "points": ["A) (2/3)g sin\u03b8", "B) (1/2)g sin\u03b8", "C) (2/5)g sin\u03b8", "D) (3/4)g sin\u03b8"]}, {"detail": "Let I = \u222b[from 0 to \u03c0/2] (sin x) / (sin x + cos x) dx  --- (1)\n\nWe use the property of definite integrals: \u222b[from 0 to a] f(x) dx = \u222b[from 0 to a] f(a-x) dx.\nApplying this property with a = \u03c0/2:\nI = \u222b[from 0 to \u03c0/2] (sin (\u03c0/2 - x)) / (sin (\u03c0/2 - x) + cos (\u03c0/2 - x)) dx\nSince sin(\u03c0/2 - x) = cos x and cos(\u03c0/2 - x) = sin x, the integral becomes:\nI = \u222b[from 0 to \u03c0/2] (cos x) / (cos x + sin x) dx  --- (2)\n\nNow, add equation (1) and equation (2):\n2I = \u222b[from 0 to \u03c0/2] [(sin x) / (sin x + cos x) + (cos x) / (cos x + sin x)] dx\n2I = \u222b[from 0 to \u03c0/2] [(sin x + cos x) / (sin x + cos x)] dx\n2I = \u222b[from 0 to \u03c0/2] 1 dx\n\nIntegrate 1 with respect to x:\n2I = [x] from 0 to \u03c0/2\n2I = (\u03c0/2) - 0\n2I = \u03c0/2\n\nDivide by 2 to find I:\nI = \u03c0/4\n\nid: C001\n\nanswer: A", "heading": "Evaluate the definite integral: \u222b[from 0 to \u03c0/2] (sin x) / (sin x + cos x) dx", "options": ["A) \u03c0/4", "B) \u03c0/2", "C) \u03c0/8", "D) \u03c0"], "points": ["A) \u03c0/4", "B) \u03c0/2", "C) \u03c0/8", "D) \u03c0"]}, {"detail": "SN1 (Substitution Nucleophilic Unimolecular) reactions proceed through a carbocation intermediate. The rate-determining step is the formation of this carbocation. Therefore, the stability of the carbocation intermediate directly influences the rate of the SN1 reaction.\n\nThe general order of carbocation stability is: Tertiary (3\u00b0) > Secondary (2\u00b0) > Primary (1\u00b0) > Methyl.\n\nLet's analyze the carbocation formed from each option:\nA) CH\u2083CH\u2082Br (Ethyl bromide) forms a primary carbocation (CH\u2083CH\u2082\u207a).\nB) (CH\u2083)\u2082CHBr (Isopropyl bromide) forms a secondary carbocation ((CH\u2083)\u2082CH\u207a).\nC) (CH\u2083)\u2083CBr (tert-Butyl bromide) forms a tertiary carbocation ((CH\u2083)\u2083C\u207a).\nD) CH\u2083Br (Methyl bromide) forms a methyl carbocation (CH\u2083\u207a).\n\nSince the tertiary carbocation ((CH\u2083)\u2083C\u207a) is the most stable among these, (CH\u2083)\u2083CBr will form this carbocation most readily, leading to the fastest SN1 reaction rate.\n\nid: O001\n\nanswer: C", "heading": "Which of the following compounds will undergo SN1 reaction fastest?", "options": ["A) CH\u2083CH\u2082Br", "B) (CH\u2083)\u2082CHBr", "C) (CH\u2083)\u2083CBr", "D) CH\u2083Br"], "points": ["A) CH\u2083CH\u2082Br", "B) (CH\u2083)\u2082CHBr", "C) (CH\u2083)\u2083CBr", "D) CH\u2083Br"]}, {"detail": "Since the inclined plane is frictionless, there are no non-conservative forces doing work (like friction). Therefore, mechanical energy is conserved.\n\nInitial state (at the top):\nMass (m) = 2 kg\nHeight (h_initial) = 5 m\nInitial speed (v_initial) = 0 m/s (released from rest)\n\nInitial Potential Energy (PE_initial) = mgh_initial = 2 kg * 10 m/s\u00b2 * 5 m = 100 J\nInitial Kinetic Energy (KE_initial) = (1/2)mv_initial\u00b2 = (1/2) * 2 kg * (0 m/s)\u00b2 = 0 J\nTotal Initial Mechanical Energy (E_initial) = PE_initial + KE_initial = 100 J + 0 J = 100 J\n\nFinal state (at the bottom):\nHeight (h_final) = 0 m (relative to the bottom)\nFinal speed (v_final) = ?\n\nFinal Potential Energy (PE_final) = mgh_final = 2 kg * 10 m/s\u00b2 * 0 m = 0 J\nFinal Kinetic Energy (KE_final) = (1/2)mv_final\u00b2 = (1/2) * 2 kg * v_final\u00b2 = v_final\u00b2 J\nTotal Final Mechanical Energy (E_final) = PE_final + KE_final = 0 J + v_final\u00b2 J = v_final\u00b2 J\n\nBy the principle of conservation of mechanical energy:\nE_initial = E_final\n100 J = v_final\u00b2 J\nv_final\u00b2 = 100\nv_final = \u221a100\nv_final = 10 m/s\n\nid: M002\n\nanswer: B", "heading": "A block of mass 2 kg is released from rest at the top of a frictionless inclined plane of height 5 m. What is the speed of the block when it reaches the bottom of the incline? (Take g = 10 m/s\u00b2)", "options": ["A) 5 m/s", "B) 10 m/s", "C) 15 m/s", "D) 20 m/s"], "points": ["A) 5 m/s", "B) 10 m/s", "C) 15 m/s", "D) 20 m/s"]}, {"detail": "Given differential equation: dy/dx = (x+y)\u00b2\n\nThis is a non-linear differential equation. We can solve it by substitution.\nLet v = x+y.\n\nDifferentiate v with respect to x:\ndv/dx = d/dx (x+y)\ndv/dx = 1 + dy/dx\n\nFrom this, we can express dy/dx as: dy/dx = dv/dx - 1.\n\nSubstitute v and dy/dx into the original differential equation:\ndv/dx - 1 = v\u00b2\ndv/dx = 1 + v\u00b2\n\nNow, this is a separable differential equation. Separate the variables v and x:\ndv / (1 + v\u00b2) = dx\n\nIntegrate both sides:\n\u222b [1 / (1 + v\u00b2)] dv = \u222b dx\n\nThe integral of 1/(1+v\u00b2) with respect to v is tan\u207b\u00b9(v).\nThe integral of 1 with respect to x is x.\n\nSo, tan\u207b\u00b9(v) = x + C (where C is the constant of integration).\n\nFinally, substitute back v = x+y:\ntan\u207b\u00b9(x+y) = x + C\n\nid: C002\n\nanswer: A", "heading": "The solution of the differential equation dy/dx = (x+y)\u00b2 is:", "options": ["A) tan\u207b\u00b9(x+y) = x + C", "B) tan\u207b\u00b9(x+y) = y + C", "C) sin\u207b\u00b9(x+y) = x + C", "D) sin\u207b\u00b9(x+y) = y + C"], "points": ["A) tan\u207b\u00b9(x+y) = x + C", "B) tan\u207b\u00b9(x+y) = y + C", "C) sin\u207b\u00b9(x+y) = x + C", "D) sin\u207b\u00b9(x+y) = y + C"]}, {"detail": "First, let's draw the structural formula of 2,3-dibromobutane:\nCH\u2083 - CH(Br) - CH(Br) - CH\u2083\n\nA chiral center (or stereocenter) is typically a carbon atom that is bonded to four different groups.\n\nLet's examine each carbon atom:\n\n1.  **C1 (CH\u2083)**: This carbon is bonded to three hydrogen atoms and one CH(Br)CH(Br)CH\u2083 group. Since it has three identical hydrogen atoms, it is not a chiral center.\n\n2.  **C2 (CH(Br))**: This carbon is bonded to four different groups:\n    *   A methyl group (CH\u2083)\n    *   A hydrogen atom (H)\n    *   A bromine atom (Br)\n    *   A -CH(Br)CH\u2083 group\n    Since all four groups are different, C2 is a chiral center.\n\n3.  **C3 (CH(Br))**: This carbon is bonded to four different groups:\n    *   A methyl group (CH\u2083)\n    *   A hydrogen atom (H)\n    *   A bromine atom (Br)\n    *   A -CH(Br)CH\u2083 group\n    Since all four groups are different, C3 is a chiral center.\n\n4.  **C4 (CH\u2083)**: Similar to C1, this carbon is bonded to three hydrogen atoms, so it is not a chiral center.\n\nTherefore, 2,3-dibromobutane has 2 chiral centers (C2 and C3).\n\nid: O002\n\nanswer: C", "heading": "How many chiral centers are present in 2,3-dibromobutane?", "options": ["A) 0", "B) 1", "C) 2", "D) 3"], "points": ["A) 0", "B) 1", "C) 2", "D) 3"]}, {"detail": "The displacement of a particle executing Simple Harmonic Motion (SHM) starting from the mean position (x=0) is given by the equation:\nx(t) = A sin(\u03c9t)\n\nWhere:\n*   A is the amplitude\n*   \u03c9 is the angular frequency\n*   t is the time\n\nThe angular frequency \u03c9 is related to the time period T by \u03c9 = 2\u03c0/T.\nSo, the equation becomes:\nx(t) = A sin((2\u03c0/T)t)\n\nWe want to find the time 't' when the particle travels from x = 0 to x = A/2.\nSet x(t) = A/2:\nA/2 = A sin((2\u03c0/T)t)\n\nDivide both sides by A:\n1/2 = sin((2\u03c0/T)t)\n\nWe know that sin(\u03c0/6) = 1/2. Therefore:\n(2\u03c0/T)t = \u03c0/6\n\nNow, solve for t:\n2t/T = 1/6\nt = (1/6) * (T/2)\nt = T/12\n\nThe time taken for the particle to travel from x = 0 to x = A/2 is T/12.\n\nid: M003\n\nanswer: D", "heading": "A particle executes SHM with an amplitude A and time period T. The time taken for the particle to travel from x = 0 to x = A/2 is:", "options": ["A) T/2", "B) T/4", "C) T/6", "D) T/12"], "points": ["A) T/2", "B) T/4", "C) T/6", "D) T/12"]}, {"detail": "To find the local maximum (or minimum) values of a function, we first need to find its critical points by taking the first derivative and setting it to zero.\n\nGiven function: f(x) = x\u00b3 - 6x\u00b2 + 9x + 15\n\nStep 1: Find the first derivative, f'(x).\nf'(x) = d/dx (x\u00b3 - 6x\u00b2 + 9x + 15)\nf'(x) = 3x\u00b2 - 12x + 9\n\nStep 2: Set f'(x) = 0 to find the critical points.\n3x\u00b2 - 12x + 9 = 0\nDivide by 3:\nx\u00b2 - 4x + 3 = 0\n\nFactor the quadratic equation:\n(x - 1)(x - 3) = 0\nSo, the critical points are x = 1 and x = 3.\n\nStep 3: Use the second derivative test to determine if these critical points correspond to a local maximum or minimum.\nFind the second derivative, f''(x).\nf''(x) = d/dx (3x\u00b2 - 12x + 9)\nf''(x) = 6x - 12\n\nEvaluate f''(x) at each critical point:\n*   At x = 1:\n    f''(1) = 6(1) - 12 = 6 - 12 = -6\n    Since f''(1) < 0, there is a local maximum at x = 1.\n\n*   At x = 3:\n    f''(3) = 6(3) - 12 = 18 - 12 = 6\n    Since f''(3) > 0, there is a local minimum at x = 3.\n\nStep 4: Calculate the value of the function at the local maximum.\nSubstitute x = 1 into the original function f(x):\nf(1) = (1)\u00b3 - 6(1)\u00b2 + 9(1) + 15\nf(1) = 1 - 6 + 9 + 15\nf(1) = 19\n\nThus, the local maximum value of the function is 19.\n\nid: C003\n\nanswer: B", "heading": "Find the local maximum value of f(x) = x\u00b3 - 6x\u00b2 + 9x + 15.", "options": ["A) 15", "B) 19", "C) 20", "D) 21"], "points": ["A) 15", "B) 19", "C) 20", "D) 21"]}, {"detail": "For a compound to be aromatic, it must satisfy H\u00fcckel's rules:\n1.  It must be cyclic.\n2.  It must be planar.\n3.  It must be fully conjugated (have a continuous ring of p-orbitals).\n4.  It must have (4n + 2) \u03c0 electrons, where n is a non-negative integer (0, 1, 2, ...).\n\nLet's analyze each option:\n\nA) **Cyclobutadiene**: It is cyclic and fully conjugated. It has 2 double bonds, contributing 4 \u03c0 electrons. According to H\u00fcckel's rule, 4 \u03c0 electrons (4n, where n=1) makes it anti-aromatic. It is highly unstable.\n\nB) **Cyclopentadienyl cation**: It is cyclic and fully conjugated (5 carbons, 2 double bonds, and a positive charge on one carbon, meaning an empty p-orbital). It has 2 double bonds, contributing 4 \u03c0 electrons. 4 \u03c0 electrons (4n, where n=1) makes it anti-aromatic. It is highly unstable.\n\nC) **Cycloheptatrienyl cation (Tropylium cation)**: It is a 7-membered cyclic system with 3 double bonds and a positive charge. It is cyclic, planar, and fully conjugated (all 7 carbons are sp\u00b2 hybridized, forming a continuous ring of p-orbitals). It has 3 double bonds, contributing 6 \u03c0 electrons. 6 \u03c0 electrons fits the (4n + 2) rule for n=1 (4*1 + 2 = 6). Therefore, cycloheptatrienyl cation is aromatic.\n\nD) **Cyclooctatetraene**: It is an 8-membered cyclic system with 4 double bonds. It has 8 \u03c0 electrons. 8 \u03c0 electrons (4n, where n=2) would suggest it is anti-aromatic. However, to avoid anti-aromaticity, cyclooctatetraene adopts a non-planar 'tub' shape, which breaks the conjugation. Thus, it is non-aromatic.\n\nBased on H\u00fcckel's rules, only Cycloheptatrienyl cation is aromatic.\n\nid: O003\n\nanswer: C", "heading": "Which of the following compounds is aromatic?", "options": ["A) Cyclobutadiene", "B) Cyclopentadienyl cation", "C) Cycloheptatrienyl cation", "D) Cyclooctatetraene"], "points": ["A) Cyclobutadiene", "B) Cyclopentadienyl cation", "C) Cycloheptatrienyl cation", "D) Cyclooctatetraene"]}, {"detail": "Let's use the principles of conservation of energy and conservation of linear momentum.\n\nInitial state (at infinite separation):\n*   Initial speeds: v\u2081_initial = 0, v\u2082_initial = 0\n*   Initial separation: r_initial = \u221e\n*   Initial Kinetic Energy (KE_initial) = 0\n*   Initial Potential Energy (PE_initial) = -G m\u2081m\u2082 / r_initial = -G m\u2081m\u2082 / \u221e = 0\n*   Total Initial Energy (E_initial) = 0\n\nFinal state (at separation 'r'):\n*   Final speeds: v\u2081 and v\u2082 (moving towards each other)\n*   Final separation: r\n*   Final Kinetic Energy (KE_final) = (1/2)m\u2081v\u2081\u00b2 + (1/2)m\u2082v\u2082\u00b2\n*   Final Potential Energy (PE_final) = -G m\u2081m\u2082 / r\n*   Total Final Energy (E_final) = (1/2)m\u2081v\u2081\u00b2 + (1/2)m\u2082v\u2082\u00b2 - G m\u2081m\u2082 / r\n\n1.  **Conservation of Energy (E_initial = E_final):**\n    0 = (1/2)m\u2081v\u2081\u00b2 + (1/2)m\u2082v\u2082\u00b2 - G m\u2081m\u2082 / r\n    (1/2)m\u2081v\u2081\u00b2 + (1/2)m\u2082v\u2082\u00b2 = G m\u2081m\u2082 / r  --- (Equation 1)\n\n2.  **Conservation of Linear Momentum:**\n    Since there are no external forces acting on the system, the total linear momentum is conserved.\n    Initial momentum = 0 (both particles are at rest).\n    Final momentum = m\u2081v\u2081 - m\u2082v\u2082 (assuming v\u2081 and v\u2082 are magnitudes, and they move in opposite directions relative to each other).\n    0 = m\u2081v\u2081 - m\u2082v\u2082\n    m\u2081v\u2081 = m\u2082v\u2082  --- (Equation 2)\n\nFrom Equation 2, we can express v\u2081 in terms of v\u2082 (or vice versa):\nv\u2081 = (m\u2082/m\u2081)v\u2082\n\nSubstitute this into Equation 1:\n(1/2)m\u2081((m\u2082/m\u2081)v\u2082)\u00b2 + (1/2)m\u2082v\u2082\u00b2 = G m\u2081m\u2082 / r\n(1/2)m\u2081(m\u2082\u00b2/m\u2081\u00b2)v\u2082\u00b2 + (1/2)m\u2082v\u2082\u00b2 = G m\u2081m\u2082 / r\n(1/2)(m\u2082\u00b2/m\u2081)v\u2082\u00b2 + (1/2)m\u2082v\u2082\u00b2 = G m\u2081m\u2082 / r\n(1/2)v\u2082\u00b2 [ (m\u2082\u00b2/m\u2081) + m\u2082 ] = G m\u2081m\u2082 / r\n(1/2)v\u2082\u00b2 [ (m\u2082\u00b2 + m\u2081m\u2082) / m\u2081 ] = G m\u2081m\u2082 / r\n(1/2)v\u2082\u00b2 [ m\u2082(m\u2082 + m\u2081) / m\u2081 ] = G m\u2081m\u2082 / r\n\nSolve for v\u2082\u00b2:\nv\u2082\u00b2 = [2G m\u2081m\u2082 / r] * [m\u2081 / (m\u2082(m\u2081 + m\u2082))]\nv\u2082\u00b2 = 2G m\u2081\u00b2 / (r(m\u2081 + m\u2082))\nv\u2082 = m\u2081 \u221a[2G / (r(m\u2081 + m\u2082))]\n\nNow, find v\u2081 using v\u2081 = (m\u2082/m\u2081)v\u2082:\nv\u2081 = (m\u2082/m\u2081) * m\u2081 \u221a[2G / (r(m\u2081 + m\u2082))]\nv\u2081 = m\u2082 \u221a[2G / (r(m\u2081 + m\u2082))]\n\nThe relative speed (v_rel) is the sum of their speeds because they are moving towards each other:\nv_rel = v\u2081 + v\u2082\nv_rel = m\u2082 \u221a[2G / (r(m\u2081 + m\u2082))] + m\u2081 \u221a[2G / (r(m\u2081 + m\u2082))]\nv_rel = (m\u2081 + m\u2082) \u221a[2G / (r(m\u2081 + m\u2082))]\n\nTo simplify, bring (m\u2081 + m\u2082) inside the square root:\nv_rel = \u221a[ (m\u2081 + m\u2082)\u00b2 * 2G / (r(m\u2081 + m\u2082)) ]\nv_rel = \u221a[ 2G(m\u2081 + m\u2082) / r ]\n\nid: M004\n\nanswer: A", "heading": "Two particles of masses m\u2081 and m\u2082 are initially at rest at an infinite distance apart. They start moving towards each other due to mutual gravitational attraction. What is their relative speed when their separation is 'r'?", "options": ["A) \u221a[2G(m\u2081 + m\u2082)/r]", "B) \u221a[G(m\u2081 + m\u2082)/r]", "C) \u221a[2G(m\u2081m\u2082)/(m\u2081 + m\u2082)r]", "D) \u221a[G(m\u2081m\u2082)/(m\u2081 + m\u2082)r]"], "points": ["A) \u221a[2G(m\u2081 + m\u2082)/r]", "B) \u221a[G(m\u2081 + m\u2082)/r]", "C) \u221a[2G(m\u2081m\u2082)/(m\u2081 + m\u2082)r]", "D) \u221a[G(m\u2081m\u2082)/(m\u2081 + m\u2082)r]"]}], "source_count": 0, "spark": [0.0], "subjects": ["load_a2ui_skill"], "summary": "Make a set of 10 IIT JEE practice questions for me, with four options each and a worked solution for every one. Cover mechanics, calculus and organic chemistry. Show it to me as something I can actually work through.", "table_rows": [{"Item": "load_a2ui_skill", "Sources": 0}], "timeline": [{"label": "run_started", "time": "1"}, {"label": "graph_patched", "time": "2"}, {"label": "task_started load_a2ui_skill", "time": "3"}, {"label": "task_succeeded load_a2ui_skill", "time": "4"}, {"label": "graph_patched", "time": "5"}, {"label": "task_started generate_questions", "time": "6"}, {"label": "task_succeeded generate_questions", "time": "7"}, {"label": "graph_patched", "time": "8"}, {"label": "task_s function mdInline(line,parent){const re=/(\*\*([^*]+)\*\*|\*([^*]+)\*|_([^_]+)_)/g;let last=0,m;while((m=re.exec(line))){if(m.index>last)parent.append(text(line.slice(last,m.index)));if(m[2]!=null){const s=document.createElement("strong");s.textContent=m[2];parent.append(s);}else{const e=document.createElement("em");e.textContent=(m[3]!=null?m[3]:m[4]);parent.append(e);}last=re.lastIndex;}if(last<line.length)parent.append(text(line.slice(last)));}

    const h=$("div","mt");h.append(text(c.title||""));e.append(tag,h);kids(c,ctx,e);return e;},
  // --- Custom extensions -----------------------------------------------------
  Notice:(c,ctx)=>{const e=$("div","Card");e.style.borderLeft="4px solid var(--"+({good:"green",warn:"amber",bad:"red"}[c.tone]||"accent")+")";e.append(text(resolve(c.text,ctx.dm)));return e;},
  StatTile:(c,ctx)=>{const e=$("div","StatTile "+(c.tone||"neutral"));
    const l=$("div","lab");l.append(text(c.label));const v=$("div","val");v.append(text(resolve(c.value,ctx.dm)+(c.unit||"")));
    const d=$("div","dl");d.append(text(resolve(c.delta,ctx.dm)||""));e.append(l,v,d);return e;},
  ProgressBar:(c,ctx)=>{const e=$("div","chart");const t=$("div","ct");t.append(text("progress"));
    const p=$("div","prog");const i=$("i");const val=+resolve(c.value,ctx.dm)||0;i.style.width=Math.min(100,val/(c.max||100)*100)+"%";
    p.append(i);e.append(t,p);const cap=$("div");cap.style.cssText="font-size:11px;color:var(--ink-muted);margin-top:6px;font-family:var(--font-mono)";cap.append(text(val+" / "+(c.max||100)));e.append(cap);return e;},
  Sparkline:(c,ctx)=>{const e=$("div","chart");const t=$("div","ct");t.append(text("trend"));e.append(t);
    const d=resolve(c.data,ctx.dm)||[];e.append(sparkSvg(d,c.tone));return e;},
  BarChart:(c,ctx)=>{const e=$("div","chart");const t=$("div","ct");t.append(text(c.title||"bar chart"));e.append(t);
    e.append(barSvg(resolve(c.data,ctx.dm)||[],c.xKey,c.yKey));return e;},
  DataTable:(c,ctx)=>renderTable(c,ctx),
  Timeline:(c,ctx)=>renderTimeline(c,ctx),
  ApprovalCard:(c,ctx)=>renderApproval(c,ctx),
};

function field(c,mk){const wrap=$("label","field");if(c.label){const l=$("span","lb");l.append(text(c.label));wrap.append(l);}wrap.append(mk());return wrap;}

function kids(c,ctx,e){ for(const id of (c.children||[])){ const child=ctx.byId[id]; if(child) e.append(renderComponent(child,ctx)); } }
function renderComponent(c,ctx){ const r=RENDERERS[c.type]; if(!r){ const s=$("div");s.style.cssText="color:var(--red-ink);font-family:var(--font-mono);font-size:11px";s.append(text("[skipped unknown type: "+c.type+"]"));return s;} return r(c,ctx); }

function sparkSvg(vals,tone){const w=180,h=44,max=Math.max(...vals,1),min=Math.min(...vals,0);const rng=(max-min)||1;
  const pts=vals.map((v,i)=>`${i/(vals.length-1||1)*w},${h-6-(v-min)/rng*(h-12)}`).join(" ");
  const col=({good:"var(--green)",warn:"var(--amber)",bad:"var(--red)"}[tone]||"var(--accent)");
  const ns="http://www.w3.org/2000/svg";const svg=document.createElementNS(ns,"svg");svg.setAttribute("viewBox",`0 0 ${w} ${h}`);svg.setAttribute("width","100%");svg.setAttribute("height",h);
  const pl=document.createElementNS(ns,"polyline");pl.setAttribute("points",pts);pl.setAttribute("fill","none");pl.setAttribute("stroke",col);pl.setAttribute("stroke-width","2.5");svg.append(pl);return svg;}

function barSvg(data,xk,yk,unit){const ns="http://www.w3.org/2000/svg";const w=300,h=150,pad=24;
  const max=Math.max(...data.map(d=>+d[yk]),1);const bw=(w-pad*2)/data.length*.62;
  const svg=document.createElementNS(ns,"svg");svg.setAttribute("viewBox",`0 0 ${w} ${h}`);svg.setAttribute("width","100%");svg.setAttribute("height","auto");
  data.forEach((d,i)=>{const x=pad+i*((w-pad*2)/data.length)+((w-pad*2)/data.length-bw)/2;const bh=(+d[yk])/max*(h-pad*2);
    const r=document.createElementNS(ns,"rect");r.setAttribute("x",x);r.setAttribute("y",h-pad-bh);r.setAttribute("width",bw);r.setAttribute("height",bh);r.setAttribute("rx",3);r.setAttribute("fill","var(--accent)");svg.append(r);
    const tv=document.createElementNS(ns,"text");tv.setAttribute("x",x+bw/2);tv.setAttribute("y",h-pad-bh-4);tv.setAttribute("text-anchor","middle");tv.setAttribute("font-size","10");tv.setAttribute("font-family","var(--font-mono)");tv.setAttribute("fill","var(--ink-muted)");tv.textContent=d[yk];svg.append(tv);
    const tl=document.createElementNS(ns,"text");tl.setAttribute("x",x+bw/2);tl.setAttribute("y",h-8);tl.setAttribute("text-anchor","middle");tl.setAttribute("font-size","10");tl.setAttribute("font-family","var(--font-mono)");tl.setAttribute("fill","var(--ink-muted)");tl.textContent=d[xk];svg.append(tl);});
  return svg;}

function renderTable(c,ctx){const wrap=$("div");const cols=(c.columns||"").split(",").map(s=>s.trim());let rows=(resolve(c.rows,ctx.dm)||[]).slice();
  if(c.filterKey){const f=$("input","filter");f.placeholder="filter "+c.filterKey+"…";f.oninput=()=>draw(f.value);wrap.append(f);}
  const t=$("table");wrap.append(t);let sortCol=null,sortDir=1;
  function draw(filter){t.textContent="";const tr=$("tr");cols.forEach(col=>{const th=$("th");th.append(text(col));th.onclick=()=>{sortDir=sortCol===col?-sortDir:1;sortCol=col;draw(filter);};if(c.sortable&&sortCol===col)th.append(text(sortDir>0?" ▲":" ▼"));tr.append(th);});t.append(tr);
    let view=rows;if(filter)view=view.filter(r=>String(r[c.filterKey]||"").toLowerCase().includes(filter.toLowerCase()));
    if(sortCol)view=view.slice().sort((a,b)=>{const x=a[sortCol],y=b[sortCol];return(x>y?1:x<y?-1:0)*sortDir;});
    view.forEach(r=>{const rr=$("tr");cols.forEach(col=>{const td=$("td");td.append(text(r[col]));rr.append(td);});t.append(rr);});}
  draw("");return wrap;}

function renderTabs(c,ctx){const wrap=$("div");const nav=$("div","tabs");wrap.append(nav);const body=$("div");wrap.append(body);
  // A2UI Basic Tabs: each child IS a panel; `labels` names the tabs (comma list).
  const panels=(c.children||[]).map(id=>ctx.byId[id]).filter(Boolean);
  const labels=(c.labels||"").split(",").map(s=>s.trim());
  function show(i){body.textContent="";[...nav.children].forEach((b,j)=>b.classList.toggle("on",i===j));const p=panels[i];if(p)body.append(renderComponent(p,ctx));}
  panels.forEach((p,i)=>{const b=$("button");b.append(text(labels[i]||("tab "+(i+1))));b.onclick=()=>show(i);nav.append(b);});
  if(panels.length)show(0);return wrap;}

function renderTimeline(c,ctx){const e=$("div","chart");const t=$("div","ct");t.append(text(c.title||"timeline"));e.append(t);
  // Accepts either the showcase {seq,kind,node} or the compose {time,label} shape.
  const box=$("div","tl");(resolve(c.events,ctx.dm)||[]).forEach(ev=>{const r=$("div","r");
    const s=$("span","s");s.append(text(String(ev.seq!=null?ev.seq:(ev.time!=null?ev.time:"")).padStart(2)));
    const k=$("span","k");k.append(text(ev.kind!=null?ev.kind:(ev.label!=null?ev.label:"")));
    const n=$("span","n");n.append(text(ev.node!=null?ev.node:""));r.append(s,k,n);box.append(r);});e.append(box);return e;}

function renderApproval(c,ctx){const e=$("div","Approval");const sm=$("div","sm");sm.append(text(resolve(c.summary,ctx.dm)));
  const pre=$("pre");pre.append(text(JSON.stringify(resolve(c.params,ctx.dm),null,2)));const btns=$("div","btns");
  const ok=$("button","ok");ok.append(text("Approve"));ok.onclick=()=>emitAction("approve",resolve(c.params,ctx.dm));
  const no=$("button");no.append(text("Reject"));no.onclick=()=>emitAction("reject",{});btns.append(ok,no);e.append(sm,pre,btns);return e;}

function emitAction(name,args){ // the only way the surface changes the world: a named, validated event
  document.getElementById("meta").textContent = "action emitted → "+name+" "+JSON.stringify(args);
}

function render(surface){const byId={};surface.components.forEach(c=>byId[c.id]=c);const ctx={byId,dm:surface.dataModel||{}};
  const mount=document.getElementById("mount");mount.textContent="";mount.append(renderComponent(byId[surface.root],ctx));}

// ---- AG-UI live state channel, with STATE_SNAPSHOT reconnect ---------------
// The client folds STATE_DELTA events into a data model exactly as the server
// does. If the stream drops mid-run it reconnects with ?reconnect=1; the server
// then leads with ONE STATE_SNAPSHOT carrying the COMPLETE data model, and the
// client rebuilds from that single frame instead of replaying every delta.
// State is data: it is only ever shown through text nodes, never as markup.
function emptyState(){ return { results:{}, patches:[] }; }
function applyDelta(state, ev){ // mirror of the server reducer
  const d = ev && ev.delta; if(!d) return state;
  if(d.op==="add" && typeof d.path==="string" && d.path.indexOf("/results/")===0){
    state.results[d.path.slice("/results/".length)] = d.value;
  } else if(d.op==="graph_patched"){
    state.patches.push({reason:d.reason||"", trigger:d.trigger});
  }
  return state;
}
function showLive(state, note){
  const n = Object.keys(state.results).length, p = state.patches.length;
  document.getElementById("live").textContent =
    (note?note+" · ":"") + n + " results · " + p + " patches folded";
}

function openStream(){
  let state = emptyState();
  let rebuiltFromSnapshot = false;
  let done = false;
  let reconnected = false;

  function connect(reconnect){
    const url = `/v1/runs/${RUN}/events` + (reconnect ? "?reconnect=1" : "");
    const es = new EventSource(url);
    es.onmessage = (m) => {
      let ev; try { ev = JSON.parse(m.data); } catch(_) { return; }
      if(ev.type==="STATE_SNAPSHOT"){
        // Rebuild the whole data model from this one frame — do NOT replay deltas.
        state = ev.state && typeof ev.state==="object" ? ev.state : emptyState();
        state.results = state.results || {}; state.patches = state.patches || [];
        rebuiltFromSnapshot = true;
        showLive(state, "rebuilt from snapshot");
        return;
      }
      if(ev.type==="RUN_FINISHED"){ done = true; showLive(state, done?"run finished":""); es.close(); return; }
      // After a snapshot rebuild we are already whole; replayed deltas are not
      // re-folded (the snapshot is authoritative for the history it covers).
      if(!rebuiltFromSnapshot) applyDelta(state, ev);
      showLive(state, reconnected?"reconnected":"");
    };
    es.onerror = () => {
      es.close();
      if(done || reconnected) return;      // clean end, or already recovered
      reconnected = true;                  // a real mid-run drop: recover via snapshot
      connect(true);
    };
  }
  connect(false);
}

async function boot(){
  const data = window.__S17__;
  document.getElementById("badge").textContent = (data.clean===false?"UNSAFE":"safe · "+ (data.component_count||data.surface.components.length) +" components · 0 executable");
  document.getElementById("meta").textContent = "declarative surface rendered natively";
  render(data.surface);
  /* recorded surface */  // fold the AG-UI state live; recover a dropped stream via STATE_SNAPSHOT
}
boot().catch(e=>{document.getElementById("badge").textContent="error";document.getElementById("meta").textContent=String(e);});
</script>
